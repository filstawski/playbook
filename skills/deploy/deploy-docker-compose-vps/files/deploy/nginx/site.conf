# One environment's site on the host's nginx, as a template: deploy.sh renders it for each
# environment (__DOMAIN__ its address, __APP_PORT__ the loopback port compose.yaml gives its app)
# into /etc/nginx/sites-available/<address>.conf, links it from sites-enabled/ once the certificate
# is there (`deploy.sh setup` gets it: certbot certonly --nginx -d <address>), and keeps the one
# before if `nginx -t` refuses it. TLS ends here; the app listens on 127.0.0.1 alone.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    # http2 as a listen parameter, which nginx before 1.25 knows too (newer ones take it, with a warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    # certbot's TLS settings, which its nginx plugin writes.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # What a form sends. Raise it if the app takes uploads through itself; large files are better
    # sent from the browser straight to an object store on an address of its own.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The client's address alone, replacing whatever the request brought: a chain the client
        # started could name anyone, and rate limits and audit logs take it as it is.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Pages stream as they render: on to the browser as they come. A server-sent events stream
        # also answers with `X-Accel-Buffering: no` and beats more often than proxy_read_timeout (60 s).
        proxy_buffering off;
    }
}
