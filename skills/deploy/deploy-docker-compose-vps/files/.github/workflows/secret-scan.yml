# Every pull request and every push to main, whatever it changes: a key pasted into a doc has leaked
# as much as one in the code.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # TruffleHog scans the commits a push or PR adds, so it needs the history.
          fetch-depth: 0
      # An exact release, not a moving tag: this action reads every commit.
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --results=verified,unknown
